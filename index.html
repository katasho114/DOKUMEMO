<meta name="viewport" content="width=device-width, initial-scale=1.0">

<img src="ヘッダー画像.png" alt="読メモのヘッダー画像" id="topBanner">

<h2>今日の読書メモ</h2>
<div>
  <input id="bookTitle" type="text" placeholder="本のタイトルを入力">
</div>

<div>
  <textarea id="bookLearning" rows="8" cols="30" placeholder="この本から得た学びを入力"></textarea>
</div>

<button id="saveButton">保存する</button>

<h2>保存した読書メモ</h2>
<div id="bookList"></div>

<details class="settingsArea">
  <summary>⚙️ 設定・データ管理</summary>

  <div class="settingsContent">
    <h3>あなたの読書記録を、大切に。</h3>

    <p>DOKUMEMOの読書記録は、お使いのブラウザに保存されています。</p>

    <p>ブラウザのデータ削除や端末の故障などによって、記録が消えてしまう可能性があります。</p>

    <p>「この記録だけは絶対に残しておきたい！」という方は、定期的にバックアップを取っておくと安心です。</p>

    <p>スマホからも保存できますが、ファイルを整理・保管しやすいパソコンでのバックアップもおすすめです。</p>

    <div class="backupArea">
      <button id="backupButton">📥 バックアップを保存</button>
      <button id="restoreButton">📤 バックアップを復元</button>
      <input type="file" id="backupFile" accept=".json" hidden>
    </div>
  </div>
</details>

<script>
let editingIndex = -1;

let savedBooks = JSON.parse(localStorage.getItem('books') || '[]');

// 保存済みの読書メモを表示する
savedBooks.forEach(function(book, index) {

  let card = document.createElement('div');
  card.className = 'bookCard';

  let titleElement = document.createElement('strong');
  titleElement.textContent = book.title;

  let learningElement = document.createElement('p');
  learningElement.textContent = book.learning;

  // 編集ボタン
  let editButton = document.createElement('button');
  editButton.textContent = '編集する';

  editButton.addEventListener('click', function() {
    editingIndex = index;

    document.getElementById('bookTitle').value = book.title;
    document.getElementById('bookLearning').value = book.learning;

    document.getElementById('saveButton').textContent = '変更を保存する';
  });

  // 削除ボタン
  let deleteButton = document.createElement('button');
  deleteButton.textContent = '削除する';

  deleteButton.addEventListener('click', function() {
    let answer = confirm('本当に削除しますか？');

    if (answer) {
      let books = JSON.parse(localStorage.getItem('books') || '[]');

      books.splice(index, 1);

      localStorage.setItem('books', JSON.stringify(books));

      location.reload();
    }
  });

  // ボタンを右下に並べる
  let buttonArea = document.createElement('div');
  buttonArea.className = 'buttonArea';

  buttonArea.appendChild(editButton);
  buttonArea.appendChild(deleteButton);

  // カードを完成させる
  card.appendChild(titleElement);
  card.appendChild(learningElement);
  card.appendChild(buttonArea);

  document.getElementById('bookList').appendChild(card);
});

// 保存ボタン
document.getElementById('saveButton').addEventListener('click', function() {

  let title = document.getElementById('bookTitle').value;
  let learning = document.getElementById('bookLearning').value;

  if (title.trim() === '' || learning.trim() === '') {
    alert('タイトルと学びの両方を入力してください！');
    return;
  }

  let book = {
    title: title,
    learning: learning
  };

  let books = JSON.parse(localStorage.getItem('books') || '[]');

  if (editingIndex === -1) {
    // 新規保存
    books.push(book);
  } else {
    // 編集した内容を上書き
    books[editingIndex] = book;
  }

  localStorage.setItem('books', JSON.stringify(books));

  alert('読書メモを保存しました！');

  location.reload();
});

document.getElementById('backupButton').addEventListener('click', function() {

  let books = JSON.parse(localStorage.getItem('books') || '[]');

  if (books.length === 0) {
    alert('バックアップする読書メモがありません！');
    return;
  }

  let data = JSON.stringify(books, null, 2);

  let blob = new Blob([data], { type: 'application/json' });

  let url = URL.createObjectURL(blob);

  let link = document.createElement('a');
  link.href = url;
  link.download = 'DOKUMEMO-backup.json';

  document.body.appendChild(link);
  link.click();
  link.remove();

  URL.revokeObjectURL(url);
});

document.getElementById('restoreButton').addEventListener('click', function() {
  document.getElementById('backupFile').click();
});

document.getElementById('backupFile').addEventListener('change', async function(event) {
  const file = event.target.files[0];
  if (!file) return;

  try {
    const text = await file.text();
    const backupBooks = JSON.parse(text);

    // バックアップの基本的な形式を確認
    if (
      !Array.isArray(backupBooks) ||
      !backupBooks.every(book =>
        book !== null &&
        typeof book === 'object' &&
        !Array.isArray(book) &&
        typeof book.title === 'string' &&
        typeof book.learning === 'string'
      )
    ) {
      alert('正しいDOKUMEMOのバックアップファイルではありません。');
      return;
    }

    const currentBooks = JSON.parse(
      localStorage.getItem('books') || '[]'
    );

    if (!Array.isArray(currentBooks)) {
      throw new Error('保存データの形式が不正です');
    }

    // 同じタイトル・内容の記録は追加しない
    const mergedBooks = [...currentBooks];
    let addedCount = 0;

    backupBooks.forEach(book => {
      const exists = mergedBooks.some(saved =>
        saved.title === book.title &&
        saved.learning === book.learning
      );

      if (!exists) {
        mergedBooks.push(book);
        addedCount++;
      }
    });

    if (addedCount === 0) {
      alert('追加する新しい読書メモはありませんでした。');
      return;
    }

    const ok = confirm(
      `バックアップから${addedCount}件の読書メモを追加します。\n` +
      '現在の読書メモは削除しません。\n\n' +
      '復元してもよろしいですか？'
    );

    if (!ok) return;

    localStorage.setItem('books', JSON.stringify(mergedBooks));

    alert(`${addedCount}件の読書メモを復元しました！`);

    // 画面を更新して復元結果を表示
    location.reload();

  } catch (error) {
    console.error(error);
    alert('読み込みに失敗しました。ファイルを確認してください。');
  } finally {
    event.target.value = '';
  }
});

</script>


<style>
  #bookList {
    white-space: pre-line;
  }
  
body {
  background-color: #F4F7FF;
  color: #29365F;
  font-family: sans-serif;
  padding: 20px;
  max-width: 600px;
  margin: 0 auto;
}


  h1 {
    color: #6E56D9;
  }
  
#saveButton {
  background-color: #6E56D9;
  color: white;
  border: none;
  border-radius: 10px;
  padding: 12px 24px;

#bookLearning {

  margin-bottom: 12px;

  font-family: inherit;

  background-color: #FFF2DE;

  display: block;

}

  margin: 0;

  color: #6E56D9;
  border-color: #C3B6FF;
}

#formatButton,
#saveButton {

  min-height: 52px;

  padding: 14px 16px;

  border-radius: 12px;

}

#voiceButton {

  color: white;
  border: none;
}

#formatButton {
  background-color: #EEE8FF;
  color: #6E56D9;
  border: 1px solid #C3B6FF;
}

.bookCard .buttonArea button {
  min-height: 44px;
  padding: 10px 14px;
  font-size: 15px;
}

  color: white;

  margin-bottom: 20px;

}

.heroIcon {

}

.heroTitle {

}

.heroSub {

  margin-bottom: 6px;
  opacity: 0.95;
}

.heroMini {
  font-size: 13px;
  margin: 0;
  opacity: 0.85;
}

#topBanner {
  display: block;
  width: 100%;
  height: auto;
  border-radius: 14px;
  margin-bottom: 24px;
}

.settingsArea {
  background-color: white;
  border: 1px solid #DDD5F9;

}

.settingsArea summary {

.settingsContent {

}

}

  margin-top: 16px;
}

.backupArea button {

  cursor: pointer;
}

  background-color: #6E56D9;

</style>
